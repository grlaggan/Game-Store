name: GameStore Deploy

on:
  push:
    branches:
      - dev
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Prepare WordPress archive
        run: |
          WP_LINK=$(cat wp-version-control.cfg)
          wget -O "./wordpress.zip" "$WP_LINK"

      - name: Prepare plugins and themes archive
        run: zip -r wpcontent.zip plugins themes mu-plugins

      - name: Copy deployment files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./wordpress.zip, ./wpcontent.zip, ./docker-compose.yml"
          target: ${{ github.event_name == 'push' && 'public_html/dev/' || 'public_html/live/' }}

      - name: Deploy and start Docker containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -eu
            TARGET="${{ github.event_name == 'push' && 'public_html/dev' || 'public_html/live' }}"
            WP_ROOT="$TARGET/.srv/wordpress"
            COMPOSE_FILE="$TARGET/docker-compose.yml"

            command -v docker
            docker compose version
            mkdir -p "$WP_ROOT"
            touch "$WP_ROOT/.maintenance"

            unzip -t "$TARGET/wordpress.zip" >/dev/null
            unzip -t "$TARGET/wpcontent.zip" >/dev/null

            TMP_DIR="$(mktemp -d)"
            trap 'rm -rf "$TMP_DIR"' EXIT
            unzip -q "$TARGET/wordpress.zip" -d "$TMP_DIR"
            CORE_DIR="$TMP_DIR/wordpress"

            rm -rf "$WP_ROOT/wp-admin" "$WP_ROOT/wp-includes"
            find "$WP_ROOT" -maxdepth 1 -type f -name "*.php" ! -name "wp-config.php" -delete
            find "$CORE_DIR" -mindepth 1 -maxdepth 1 ! -name "wp-content" ! -name "wp-config.php" -exec cp -a {} "$WP_ROOT/" \;

            mkdir -p "$WP_ROOT/wp-content"
            rm -rf "$WP_ROOT/wp-content/plugins" "$WP_ROOT/wp-content/themes" "$WP_ROOT/wp-content/mu-plugins"
            unzip -q -o "$TARGET/wpcontent.zip" -d "$WP_ROOT/wp-content"

            docker compose -f "$COMPOSE_FILE" up -d --pull always

            rm -f "$WP_ROOT/.maintenance"
            rm -f "$TARGET/wordpress.zip" "$TARGET/wpcontent.zip"
